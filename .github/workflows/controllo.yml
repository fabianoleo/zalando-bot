name: Controllo Zalando

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Mandami su Telegram le taglie che vedi"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: zalando

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa
        run: pip install -r requirements.txt

      - name: Controlla taglie
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py ${{ inputs.test && '--test' || '' }}

      - name: Salva stato
        run: |
          git config user.name "zalando-bot"
          git config user.email "zalando-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "aggiorna stato" && git push)
